name: Core CI

on:
  push:
    branches: [main, integration, mem1, mem2, mem3, mem4]
  pull_request:
    branches: [main]

jobs:
  python-core:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            adapters/requirements.txt
            anomaly/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r adapters/requirements.txt
          pip install -r anomaly/requirements.txt
      - name: Test adapters and anomaly rules
        run: python -m pytest adapters/tests anomaly/tests -v
      - name: Compile Python sources
        run: python -m compileall -q adapters anomaly demo

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r anomaly/requirements.txt
      - run: python -m pytest demo/tests -q
      - run: python -m demo.run --inject-loop --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
