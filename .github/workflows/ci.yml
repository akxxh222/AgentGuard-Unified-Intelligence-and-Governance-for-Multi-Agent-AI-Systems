name: Core CI

on:
  push:
    branches: [main, mem1]
  pull_request:
    branches: [main]

jobs:
  python-core:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            adapters/requirements.txt
            anomaly/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r adapters/requirements.txt
          pip install -r anomaly/requirements.txt
      - name: Test adapters and anomaly rules
        run: python -m pytest adapters/tests anomaly/tests -v
      - name: Compile Python sources
        run: python -m compileall -q adapters anomaly
