# Redis configuration for Agent Control Tower

# Persistence
save 60 1000
appendonly yes
appendfilename "appendonly.aof"

# Memory policy — evict least recently used keys when maxmemory reached
maxmemory 256mb
maxmemory-policy allkeys-lru

# Streams — keep up to 10k entries per stream by default
# (adapters use MAXLEN ~ when publishing)

# Networking
bind 0.0.0.0
protected-mode no
port 6379

# Logging
loglevel notice
